pre-commit:
  jobs:
    - run: pnpm fix {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
      stage_fixed: true
    # Formatted only: oxlint exits 1 when it is given no files it lints.
    - run: pnpm exec oxfmt {staged_files}
      glob:
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true
